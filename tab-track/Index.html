<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <!-- PWA / iOS home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tab Tracker">
  <meta name="theme-color" content="#000000">
  <title>Tab Tracker</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: #000; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
  </style>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useRef, useEffect } = React;

    const CURRENCIES = ["$", "¥", "HK$", "S$", "RM", "₩", "€", "£"];
    const STORAGE_KEY = "tab-tracker-v1";

    function loadPeople() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }
      catch { return []; }
    }

    // ── Toggle ──────────────────────────────────────────────────────────────
    function Toggle({ turn, onChange }) {
      const options = [
        { val: "mine",   label: "My turn", color: "#FF6B6B" },
        { val: "theirs", label: "Theirs",  color: "#34C759" },
      ];
      return (
        <div style={{
          display: "flex", background: "#111", borderRadius: 20,
          padding: "3px", gap: 2, border: "1px solid #2C2C2E",
          width: 136, flexShrink: 0,
        }}>
          {options.map(({ val, label, color }) => {
            const active = turn === val;
            return (
              <button
                key={val}
                onClick={e => { e.stopPropagation(); onChange(val); }}
                style={{
                  flex: 1, height: 28, borderRadius: 16, border: "none",
                  background: active ? color : "transparent",
                  color: active ? "#fff" : "#555",
                  fontSize: 10, fontWeight: active ? 700 : 500,
                  cursor: "pointer",
                  transition: "all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1)",
                  fontFamily: "inherit", whiteSpace: "nowrap",
                }}
              >{label}</button>
            );
          })}
        </div>
      );
    }

    // ── Swipe-to-delete row ─────────────────────────────────────────────────
    function SwipeRow({ onDelete, children }) {
      const [swipeX, setSwipeX] = useState(0);
      const [dragging, setDragging] = useState(false);
      const startX = useRef(null);
      const SNAP = 76;

      const commit = () => {
        setDragging(false);
        startX.current = null;
        setSwipeX(prev => prev < -SNAP * 0.45 ? -SNAP : 0);
      };

      const onTouchStart = e => { startX.current = e.touches[0].clientX; setDragging(true); };
      const onTouchMove  = e => {
        if (startX.current === null) return;
        const dx = e.touches[0].clientX - startX.current;
        if (dx < 0) setSwipeX(Math.max(dx, -SNAP - 8));
        else setSwipeX(0);
      };
      const onTouchEnd = () => commit();
      const onMouseDown = e => { startX.current = e.clientX; setDragging(true); };

      useEffect(() => {
        if (!dragging) return;
        const move = e => {
          if (startX.current === null) return;
          const dx = e.clientX - startX.current;
          if (dx < 0) setSwipeX(Math.max(dx, -SNAP - 8));
          else setSwipeX(0);
        };
        const up = () => commit();
        window.addEventListener("mousemove", move);
        window.addEventListener("mouseup", up);
        return () => { window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); };
      }, [dragging]);

      return (
        <div style={{ position: "relative", marginBottom: 10, borderRadius: 16, overflow: "hidden" }}>
          <div style={{
            position: "absolute", right: 0, top: 0, bottom: 0, width: SNAP,
            background: "#FF3B30", display: "flex", alignItems: "center",
            justifyContent: "center", borderRadius: "0 16px 16px 0",
            opacity: Math.max(0, -swipeX / SNAP),
            transition: dragging ? "opacity 0.05s" : "opacity 0.2s",
          }}>
            <button onClick={onDelete} style={{
              background: "none", border: "none", color: "#fff",
              fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: "inherit",
            }}>Delete</button>
          </div>
          <div
            style={{
              transform: `translateX(${swipeX}px)`,
              transition: dragging ? "none" : "transform 0.3s cubic-bezier(0.34,1.56,0.64,1)",
              cursor: dragging ? "grabbing" : "grab",
              userSelect: "none",
            }}
            onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
            onMouseDown={onMouseDown}
          >
            {children}
          </div>
        </div>
      );
    }

    // ── Person row ──────────────────────────────────────────────────────────
    function PersonRow({ person, onTurnChange, onDelete }) {
      const isTheirs  = person.turn === "theirs";
      const color     = isTheirs ? "#34C759" : "#FF6B6B";
      const label     = isTheirs ? "Their turn" : "Your turn";
      const hasAmount = !!person.amount;

      return (
        <SwipeRow onDelete={() => onDelete(person.id)}>
          <div style={{
            display: "flex", alignItems: "center", padding: "12px 14px",
            background: "#1C1C1E", borderRadius: 16, gap: 10,
            boxShadow: "0 1px 4px rgba(0,0,0,0.45)",
          }}>
            <div style={{
              width: 40, height: 40, borderRadius: "50%", flexShrink: 0,
              background: `linear-gradient(135deg, ${color}44, ${color}18)`,
              border: `2px solid ${color}77`,
              display: "flex", alignItems: "center", justifyContent: "center",
              fontSize: 16, fontWeight: 700, color,
              transition: "all 0.3s ease",
            }}>
              {person.name[0].toUpperCase()}
            </div>

            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{
                fontSize: 15, fontWeight: 600, color: "#F2F2F7",
                overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
              }}>{person.name}</div>
              <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 2 }}>
                <span style={{ fontSize: 11, color, fontWeight: 500, transition: "color 0.3s" }}>
                  {label}
                </span>
                {hasAmount && (
                  <span style={{
                    fontSize: 10, background: "rgba(192,57,43,0.18)",
                    border: "1px solid rgba(192,57,43,0.4)",
                    color: "#FF8A80", borderRadius: 8, padding: "1px 7px", fontWeight: 600,
                  }}>
                    🧧 {person.currency}{person.amount}
                  </span>
                )}
              </div>
            </div>

            <Toggle turn={person.turn} onChange={val => onTurnChange(person.id, val)} />
          </div>
        </SwipeRow>
      );
    }

    // ── Add panel ───────────────────────────────────────────────────────────
    function AddPanel({ onAdd }) {
      const [name, setName]       = useState("");
      const [amount, setAmount]   = useState("");
      const [currency, setCurrency] = useState("$");
      const [showAmt, setShowAmt] = useState(false);

      const submit = () => {
        const trimmed = name.trim();
        if (!trimmed) return;
        onAdd({ name: trimmed, amount: amount.trim(), currency });
        setName(""); setAmount(""); setShowAmt(false);
      };

      return (
        <div style={{
          margin: "0 20px 12px", background: "#1C1C1E",
          borderRadius: 16, padding: "14px", border: "1px solid #2C2C2E",
          display: "flex", flexDirection: "column", gap: 10,
        }}>
          <input
            autoFocus type="text" placeholder="Name…"
            value={name} onChange={e => setName(e.target.value)}
            onKeyDown={e => e.key === "Enter" && submit()}
            style={{
              background: "#2C2C2E", border: "1px solid #3C3C3E", borderRadius: 10,
              padding: "10px 12px", color: "#F2F2F7", fontSize: 15,
              fontFamily: "inherit", outline: "none", caretColor: "#34C759",
              width: "100%", boxSizing: "border-box",
            }}
          />

          <button
            onClick={() => setShowAmt(s => !s)}
            style={{
              background: "none", border: "none", color: showAmt ? "#FF8A80" : "#555",
              cursor: "pointer", fontSize: 12, fontWeight: 600,
              fontFamily: "inherit", textAlign: "left", padding: 0,
            }}
          >
            🧧 {showAmt ? "Remove amount" : "Add red packet / amount (optional)"}
          </button>

          {showAmt && (
            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <select
                value={currency} onChange={e => setCurrency(e.target.value)}
                style={{
                  background: "#2C2C2E", border: "1px solid #3C3C3E", borderRadius: 10,
                  padding: "10px 8px", color: "#F2F2F7", fontSize: 14,
                  fontFamily: "inherit", outline: "none", cursor: "pointer",
                  width: 74, flexShrink: 0,
                }}
              >
                {CURRENCIES.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
              <input
                type="number" placeholder="Amount"
                value={amount} onChange={e => setAmount(e.target.value)}
                style={{
                  flex: 1, background: "#2C2C2E", border: "1px solid #3C3C3E",
                  borderRadius: 10, padding: "10px 12px", color: "#F2F2F7",
                  fontSize: 15, fontFamily: "inherit", outline: "none", caretColor: "#34C759",
                }}
              />
            </div>
          )}

          <button onClick={submit} style={{
            background: "#34C759", border: "none", borderRadius: 10,
            padding: "12px", color: "#000", fontWeight: 700,
            fontSize: 14, cursor: "pointer", fontFamily: "inherit",
          }}>Add Person</button>
        </div>
      );
    }

    // ── Main app ────────────────────────────────────────────────────────────
    function TabTracker() {
      const [people,  setPeople]  = useState(loadPeople);
      const [search,  setSearch]  = useState("");
      const [sortAZ,  setSortAZ]  = useState(false);
      const [showAdd, setShowAdd] = useState(false);
      const [nextId,  setNextId]  = useState(
        () => { const p = loadPeople(); return p.length ? Math.max(...p.map(x => x.id)) + 1 : 1; }
      );

      // Persist on every change
      useEffect(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(people));
      }, [people]);

      const filtered = useMemo(() => {
        let list = people.filter(p => p.name.toLowerCase().includes(search.toLowerCase()));
        if (sortAZ) list = [...list].sort((a, b) => a.name.localeCompare(b.name));
        return list;
      }, [people, search, sortAZ]);

      const handleTurnChange = (id, val) =>
        setPeople(prev => prev.map(p => p.id === id ? { ...p, turn: val } : p));

      const handleDelete = id =>
        setPeople(prev => prev.filter(p => p.id !== id));

      const handleAdd = ({ name, amount, currency }) => {
        setPeople(prev => [...prev, { id: nextId, name, turn: amount ? "mine" : "theirs", amount, currency }]);
        setNextId(n => n + 1);
        setShowAdd(false);
      };

      return (
        <div style={{
          minHeight: "100vh", background: "#000",
          display: "flex", justifyContent: "center",
          fontFamily: "-apple-system, BlinkMacSystemFont, sans-serif",
          paddingBottom: 40,
        }}>
          <div style={{ width: "100%", maxWidth: 430, display: "flex", flexDirection: "column" }}>

            {/* Header */}
            <div style={{ padding: "20px 20px 8px" }}>
              <div style={{ fontSize: 34, fontWeight: 800, color: "#F2F2F7", letterSpacing: "-0.5px", lineHeight: 1.1 }}>
                Who's Taking<br /><span style={{ color: "#34C759" }}>The Tab?</span>
              </div>
            </div>

            {/* Search + Sort + Add */}
            <div style={{ padding: "12px 20px 8px", display: "flex", gap: 8, alignItems: "center" }}>
              <div style={{
                flex: 1, display: "flex", alignItems: "center", background: "#1C1C1E",
                borderRadius: 12, padding: "0 12px", gap: 8, border: "1px solid #2C2C2E",
              }}>
                <span style={{ color: "#555", fontSize: 14 }}>🔍</span>
                <input
                  type="text" placeholder="Search people…" value={search}
                  onChange={e => setSearch(e.target.value)}
                  style={{
                    flex: 1, background: "none", border: "none", outline: "none",
                    color: "#F2F2F7", fontSize: 15, fontFamily: "inherit",
                    padding: "10px 0", caretColor: "#34C759",
                  }}
                />
                {search && (
                  <button onClick={() => setSearch("")} style={{ background: "none", border: "none", color: "#555", cursor: "pointer", fontSize: 16, padding: 0 }}>×</button>
                )}
              </div>

              <button onClick={() => setSortAZ(s => !s)} style={{
                background: sortAZ ? "#34C75922" : "#1C1C1E",
                border: `1px solid ${sortAZ ? "#34C759" : "#2C2C2E"}`,
                borderRadius: 12, padding: "10px 12px",
                color: sortAZ ? "#34C759" : "#888",
                cursor: "pointer", fontSize: 12, fontWeight: 700, fontFamily: "inherit",
              }}>A↑Z</button>

              <button onClick={() => setShowAdd(s => !s)} style={{
                background: showAdd ? "#34C759" : "#1C1C1E",
                border: `1px solid ${showAdd ? "#34C759" : "#2C2C2E"}`,
                borderRadius: 12, padding: "10px 14px",
                color: showAdd ? "#000" : "#34C759",
                cursor: "pointer", fontSize: 20, fontWeight: 700,
                lineHeight: 1, transition: "all 0.2s ease",
              }}>{showAdd ? "×" : "+"}</button>
            </div>

            {showAdd && <AddPanel onAdd={handleAdd} />}

            {/* List */}
            <div style={{ padding: "4px 20px 20px", flex: 1 }}>
              {filtered.length === 0 ? (
                <div style={{ textAlign: "center", color: "#444", marginTop: 60, fontSize: 15 }}>
                  {search ? `No one named "${search}"` : "Add some people above!"}
                </div>
              ) : (
                filtered.map(person => (
                  <PersonRow key={person.id} person={person} onTurnChange={handleTurnChange} onDelete={handleDelete} />
                ))
              )}
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<TabTracker />);
  </script>
</body>
</html>
